name: HavenCore
version: '${version}'
main: dev.invisiblespiders.haven.core.HavenCore
description: Shared foundation services for the Haven plugin suite.
api-version: '1.26'
authors:
  - InvisibleSpiders
website: https://github.com/InvisibleSpiders/HavenAPI

# Load before any Haven plugin that depends on us
load: STARTUP

commands:
  haven:
    description: HavenCore admin command
    usage: /haven [status|version|reload]
    permission: haven.use

permissions:
  haven.use:
    description: Access to /haven status and version
    default: op
  haven.admin:
    description: Access to all /haven admin subcommands
    default: op
  haven.admin.reload:
    description: Reload HavenCore configuration
    default: op
  haven.admin.codex:
    description: View player codex data
    default: op

dependencies:
  server:
    VaultUnlocked:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
