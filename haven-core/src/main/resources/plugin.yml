name: HavenCore
version: '${version}'
main: dev.invisiblespiders.haven.core.HavenCore
description: Shared foundation services for the Haven plugin suite.
api-version: '26.1'
authors:
  - InvisibleSpiders
website: https://github.com/InvisibleSpiders/HavenCore

# Soft-depend so HavenCore loads AFTER these if present (then our hooks can find them).
# Dependent Haven plugins declare `depend: [HavenCore]` to load after us.
softdepend:
  - VaultUnlocked
  - PlaceholderAPI
  - LuckPerms

commands:
  haven:
    description: HavenCore admin command
    usage: /haven [status|version|reload]
    permission: haven.use

permissions:
  haven.use:
    description: Access to /haven status and version
    default: op
  haven.admin:
    description: Access to all /haven admin subcommands
    default: op
  haven.admin.reload:
    description: Reload HavenCore configuration
    default: op
  haven.admin.codex:
    description: View player codex data
    default: op
