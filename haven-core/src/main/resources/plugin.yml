name: HavenCore
version: '${version}'
main: dev.invisiblespiders.haven.core.HavenCore
description: Shared foundation services for the Haven plugin suite.
api-version: '26.1'
authors:
  - InvisibleSpiders
website: https://github.com/InvisibleSpiders/HavenCore

# Soft-depend so HavenCore loads AFTER these if present (then our hooks can find them).
# Note: VaultUnlocked's runtime plugin name is "Vault" (drop-in replacement).
# Dependent Haven plugins declare `depend: [HavenCore]` to load after us.
softdepend:
  - Vault
  - VaultUnlocked
  - PlaceholderAPI
  - LuckPerms

commands:
  haven:
    description: HavenCore admin command
    usage: /haven [help|status|doctor|version|reload|toggleop|upgrades|rewards]
    permission: haven.use
  upgrades:
    description: Open the Haven upgrades dialog
    usage: /upgrades
    permission: haven.upgrades
  rewards:
    description: Open the Haven rewards dialog
    usage: /rewards
    permission: haven.rewards
  afk:
    description: Toggle AFK state or manage AFK notifications
    usage: /afk [notifications]
    permission: haven.afk.manual
  channel:
    description: Switch your active chat channel
    usage: /channel <id>
  market:
    description: Submit a market advertisement
    usage: /market advertise <shopwarp> <message>
    permission: haven.market.advertise
  joinmsg:
    description: Set or select your custom join message
    usage: /joinmsg set|select|clear [value]
  quitmsg:
    description: Set or select your custom quit message
    usage: /quitmsg set|select|clear [value]
  afkmsg:
    description: Set or select your custom AFK message
    usage: /afkmsg set|select|clear [value]
  codex:
    description: View your codex progress and milestones
    usage: /codex
    permission: haven.codex

permissions:
  haven.upgrades:
    description: Open the player upgrades dialog
    default: true
  haven.rewards:
    description: Open the player rewards dialog
    default: true
  haven.use:
    description: Access to /haven help, status, and version
    default: op
  haven.admin:
    description: Access to all /haven admin subcommands
    default: op
    children:
      haven.admin.reload: true
      haven.admin.doctor: true
      haven.admin.codex: true
      haven.admin.upgrades: true
      haven.admin.rewards: true
      haven.admin.sleep: true
  haven.admin.reload:
    description: Reload HavenCore configuration
    default: op
  haven.admin.doctor:
    description: Run HavenCore diagnostic checks
    default: op
  haven.admin.codex:
    description: View player codex data
    default: op
  haven.admin.upgrades:
    description: Manage player upgrades
    default: op
  haven.admin.rewards:
    description: Manage player rewards
    default: op
  haven.afk.manual:
    description: Manually toggle AFK state with /afk
    default: true
  haven.afk.alerts:
    description: Receive alerts when suspicious AFK bypass patterns are detected
    default: op
  haven.admin.afk:
    description: Admin AFK management via /haven afk subcommands
    default: op
  haven.staff:
    description: Access to the staff chat channel
    default: op
  haven.market.advertise:
    description: Submit market advertisements via /market
    default: true
  haven.market.mute:
    description: Mute/unmute market broadcast messages
    default: true
  haven.admin.channel:
    description: Admin channel management
    default: op
  haven.messages.custom:
    description: Set personal join/quit/afk messages with /joinmsg|quitmsg|afkmsg set
    default: true
  haven.messages.bypass-filter:
    description: Bypass MiniMessage tag and regex filter when setting custom messages
    default: op
  haven.codex:
    description: Open the player codex dialog
    default: true
  haven.messages.premium:
    description: Access premium death message pool
    default: false
  haven.admin.messages:
    description: Unlock message presets for other players via /haven messages unlock
    default: op
  haven.sleep.bypass:
    description: Excluded from active player count and sleep threshold checks
    default: false
  haven.admin.sleep:
    description: Manage sleep module via /haven sleep skip|toggle|status
    default: op
